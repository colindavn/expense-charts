name: expenses_charts
description: Flutter project to track expenses
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: '>=3.1.5 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.0.15
  cupertino_icons: ^1.0.2
  sqflite: ^2.3.0
  sqflite_common_ffi: any
  path: ^1.8.3
  synchronized: ^3.1.0+1
  sqlite3_flutter_libs: ^0.5.18
  intl: ^0.20.2
  fl_chart: ^1.1.1
  flutter_launcher_icons: ^0.14.1
  permission_handler: ^12.0.1
  path_provider: ^2.1.1
  provider: ^6.1.2
  file_picker: ^10.3.3
  app_settings: ^6.1.1
  collection: ^1.18.0
  csv: ^6.0.0
  device_info_plus: ^12.1.0
  win32: ^5.7.2
  lucide_icons_flutter: 3.1.25

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
